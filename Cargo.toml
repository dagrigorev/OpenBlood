[workspace]
resolver = "2"
members = ["crates/engine", "crates/game", "crates/openblood"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["OpenBlood contributors"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = 1
