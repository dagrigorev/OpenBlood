<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- OpenBlood icon: a blood drop with a pitchfork cut out of it. Original artwork. -->
  <defs>
    <clipPath id="drop">
      <path d="M128 26 C128 26 52 110 52 160 A76 76 0 0 0 204 160 C204 110 128 26 128 26 Z"/>
    </clipPath>
  </defs>
  <rect x="0" y="0" width="256" height="256" rx="56" fill="#141016"/>
